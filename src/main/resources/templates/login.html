<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장기 - 로그인</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; font-family: sans-serif; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-login { background-color: #2e7d32; color: white; }
        .btn-signup { background-color: #8d6e63; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align: center; color: #5d4037;">♟️ 장기 로그인</h2>

    <!-- 로그인 -->
    <form action="/login" method="post">
        <input type="email" name="email" placeholder="이메일" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <button type="submit" class="btn-login">로그인</button>
    </form>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- 회원가입 -->
    <form action="/signup" method="post">
        <p style="font-size: 0.8em; color: #666; text-align: center;">계정이 없으신가요?</p>
        <input type="email" name="email" placeholder="이메일 (새 계정)" required>
        <input type="text" name="nickname" placeholder="닉네임" required>
        <input type="password" name="password" placeholder="비밀번호 (8자 이상)" required>
        <button type="submit" class="btn-signup">회원가입</button>
    </form>
</div>
</body>
</html>
