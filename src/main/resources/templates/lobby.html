<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장기 - 대기실</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f4f4f4; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .room-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .room-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #2e7d32; }

        .btn { padding: 8px 15px; border-radius: 5px; text-decoration: none; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-create { background-color: #2e7d32; }
        .btn-logout { background-color: #888; font-size: 0.9em; }
        .btn-join { background-color: #5d4037; display: block; text-align: center; margin-top: 10px; }

        .create-box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
        .create-box input { padding: 10px; flex-grow: 1; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h2>🏛️ 대기실 (Lobby)</h2>
    <div>
        <span th:text="${member.nickname}" style="font-weight: bold; margin-right: 10px;"></span>님
        <form action="/logout" method="post" style="display: inline;">
            <button type="submit" class="btn btn-logout">로그아웃</button>
        </form>
    </div>
</div>

<div class="create-box">
    <form action="/games" method="post" style="width: 100%; display: flex; gap: 10px;">
        <input type="text" name="title" placeholder="방 제목 입력" required>
        <button type="submit" class="btn btn-create">방 만들기</button>
    </form>
</div>

<div class="room-list">
    <div th:each="game : ${games}" class="room-card">
        <h3 th:text="${game.title}">방 제목</h3>
        <p>방장: <span th:text="${game.choPlayer != null ? game.choPlayer.nickname : '알 수 없음'}"></span></p>
        <p>상태: <span th:text="${game.status.description}"></span></p>

        <!-- 대기중일 때만 참가 버튼 표시 -->
        <div th:if="${game.status.name() == 'WAITING'}">
            <a th:href="@{/games/{id}/join(id=${game.id})}" class="btn btn-join">참가하기</a>
        </div>
        <div th:if="${game.status.name() != 'WAITING'}">
            <a th:href="@{/games/{id}(id=${game.id})}" class="btn btn-join" style="background-color: #888;">관전/입장</a>
        </div>
    </div>
</div>

</body>
</html>
