<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장기 - 대기실</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f4f4f4; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }

        /* 섹션 스타일 */
        .section-title { color: #555; border-left: 5px solid #5d4037; padding-left: 10px; margin: 30px 0 15px 0; }

        /* 카드 그리드 */
        .room-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .room-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; transition: transform 0.2s; }
        .room-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* 상태별 카드 색상 */
        .room-card.WAITING { border-top: 5px solid #2e7d32; }
        .room-card.IN_PROGRESS { border-top: 5px solid #c62828; background-color: #f9f9f9; }
        .room-card.FINISHED { border-top: 5px solid #7f8c8d; background-color: #f0f0f0; }

        .room-title { font-weight: bold; font-size: 1.1em; margin-bottom: 10px; display: block; }
        .room-info { font-size: 0.9em; color: #666; margin-bottom: 5px; }

        /* 버튼 스타일 */
        .btn { padding: 8px 15px; border-radius: 5px; text-decoration: none; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 0.9em; }
        .btn-create { background-color: #2e7d32; }
        .btn-logout { background-color: #888; }
        .btn-join { background-color: #5d4037; display: block; text-align: center; margin-top: 15px; }
        .btn-review { background-color: #e67e22; display: block; text-align: center; margin-top: 15px; } /* 복기 버튼 (주황) */

        .create-box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .create-box input { padding: 10px; flex-grow: 1; border: 1px solid #ddd; border-radius: 5px; }

        /* 결과 뱃지 */
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8em; color: white; float: right; }
        .badge-win { background-color: #2e7d32; }
        .badge-lose { background-color: #c62828; }
        .badge-draw { background-color: #7f8c8d; }
    </style>
</head>
<body>

<div class="header">
    <h2>🏛️ 대기실 (Lobby)</h2>
    <div>
        <span th:text="${member.nickname}" style="font-weight: bold; margin-right: 10px; font-size: 1.1em;"></span>님
        <form action="/logout" method="post" style="display: inline;">
            <button type="submit" class="btn btn-logout">로그아웃</button>
        </form>
    </div>
</div>

<!-- 1. 방 만들기 섹션 -->
<div class="create-box">
    <form action="/games" method="post" style="width: 100%; display: flex; gap: 10px;">
        <input type="text" name="title" placeholder="새로운 방 제목을 입력하세요 (예: 한 수 지도 부탁드립니다)" required>
        <button type="submit" class="btn btn-create">➕ 방 만들기</button>
    </form>
</div>

<!-- 2. 입장 가능한 방 목록 -->
<h3 class="section-title">🔥 현재 대국 중 / 대기 중</h3>
<div class="room-list">
    <!-- WAITING 또는 IN_PROGRESS인 게임만 표시 -->
    <div th:each="game : ${games}"
         th:if="${game.status.name() != 'FINISHED'}"
         class="room-card" th:classappend="${game.status}">

        <span class="room-title" th:text="${game.title}">방 제목</span>
        <div class="room-info">방장: <span th:text="${game.choPlayer != null ? game.choPlayer.nickname : '알 수 없음'}"></span></div>
        <div class="room-info">상태:
            <span th:if="${game.status.name() == 'WAITING'}" style="color: #2e7d32;">대기중</span>
            <span th:if="${game.status.name() == 'IN_PROGRESS'}" style="color: #c62828;">진행중</span>
        </div>

        <div th:if="${game.status.name() == 'WAITING'}">
            <a th:href="@{/games/{id}/join(id=${game.id})}" class="btn btn-join">참가하기</a>
        </div>
        <div th:if="${game.status.name() == 'IN_PROGRESS'}">
            <a th:href="@{/games/{id}(id=${game.id})}" class="btn btn-join" style="background-color: #7f8c8d;">관전하기</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(games)}" style="color: #888; padding: 20px;">
        현재 개설된 방이 없습니다. 방을 만들어보세요!
    </div>
</div>

<!-- 3. 내 전적 (복기) -->
<h3 class="section-title">📜 내 지난 대국 (복기)</h3>
<div class="room-list">
    <div th:each="game : ${myGames}" class="room-card FINISHED">
        <span class="room-title" th:text="${game.title}">방 제목</span>

        <!-- 승/패 표시 로직 -->
        <th:block th:with="isWin=${game.winner != null && ((game.winner.name() == 'CHO_WIN' && game.choPlayer.id == member.id) || (game.winner.name() == 'HAN_WIN' && game.hanPlayer.id == member.id))}">
            <span th:if="${isWin}" class="badge badge-win">승리</span>
            <span th:if="${!isWin && game.winner != null && game.winner.name() != 'DRAW'}" class="badge badge-lose">패배</span>
            <span th:if="${game.winner != null && game.winner.name() == 'DRAW'}" class="badge badge-draw">무승부</span>
        </th:block>

        <div class="room-info">
            VS: <span th:text="${game.choPlayer.id == member.id ? (game.hanPlayer != null ? game.hanPlayer.nickname : 'AI') : game.choPlayer.nickname}">상대방</span>
        </div>
        <div class="room-info" th:text="${#temporals.format(game.finishedAt, 'yyyy-MM-dd HH:mm')}">종료일시</div>
        <div class="room-info" th:text="'총 ' + ${game.moveCount} + '수'">총 수</div>

        <a th:href="@{/games/{id}/review(id=${game.id})}" class="btn btn-review">📜 복기 하기</a>
    </div>

    <div th:if="${#lists.isEmpty(myGames)}" style="color: #888; padding: 20px;">
        아직 완료된 대국 기록이 없습니다.
    </div>
</div>

</body>
</html>
