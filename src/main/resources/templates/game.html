<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot Janggi</title>
    <style>
        /* === [변수 정의] === */
        :root {
            --bg-color: #f4f4f4;
            --board-bg-color: #e6b87d;
            --line-color: #5d4037;
            --highlight-color: rgba(255, 215, 0, 0.8);
            --cho-color: #2e7d32;
            --han-color: #c62828;
            --movable-color: rgba(46, 204, 113, 0.8); /* 이동 가능 표시 색상 (초록) */
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }

        .game-info {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .turn-badge { font-weight: bold; padding: 5px 10px; border-radius: 4px; color: white; }
        .turn-CHO { background-color: var(--cho-color); }
        .turn-HAN { background-color: var(--han-color); }

        .board-container {
            background-color: var(--board-bg-color);
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            user-select: none;
            border: 5px solid #8d6e63;
            position: relative;
        }
        .board-container.inactive { opacity: 0.9; cursor: not-allowed; }

        .janggi-board {
            display: grid;
            grid-template-columns: repeat(9, 60px);
            grid-template-rows: repeat(10, 60px);
            position: relative;
        }

        /* === 칸 (Cell) === */
        .cell {
            position: relative; width: 60px; height: 60px;
            box-sizing: border-box; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 1;
        }
        .cell::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background-color: var(--line-color); z-index: -1; transform: translateY(-50%); }
        .cell::after { content: ''; position: absolute; top: 0; left: 50%; height: 100%; width: 2px; background-color: var(--line-color); z-index: -1; transform: translateX(-50%); }

        .cell.top-edge::after { top: 50%; height: 50%; }
        .cell.bottom-edge::after { height: 50%; }
        .cell.left-edge::before { left: 50%; width: 50%; }
        .cell.right-edge::before { width: 50%; }

        .palace-overlay { position: absolute; width: 120px; height: 120px; pointer-events: none; z-index: 0; }
        .palace-top { left: 210px; top: 30px; }
        .palace-bottom { left: 210px; top: 450px; }
        .palace-overlay::before, .palace-overlay::after { content: ''; position: absolute; background-color: var(--line-color); width: 170px; height: 2px; top: 0; left: 0; }
        .palace-overlay::before { transform-origin: 0 0; transform: rotate(45deg); }
        .palace-overlay::after { left: auto; right: 0; transform-origin: 100% 0; transform: rotate(-45deg); }

        /* === 기물 (Piece) === */
        .piece {
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold;
            background-color: #fdf5e6;
            border: 2px solid #8d6e63;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 10;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: "Gungsuh", "Batang", serif;
            line-height: 1; padding-bottom: 2px;
        }

        .piece.CHO { color: var(--cho-color); border-color: #1b5e20; }
        .piece.HAN { color: var(--han-color); border-color: #b71c1c; }

        /* 기물 크기 */
        .piece.SOLDIER, .piece.SA { width: 40px; height: 40px; font-size: 20px; }
        .piece.CHA, .piece.PO, .piece.MA, .piece.SANG { width: 48px; height: 48px; font-size: 26px; }
        .piece.GUNG { width: 56px; height: 56px; font-size: 34px; border-width: 3px; }

        /* 선택 효과 */
        .cell.selected .piece {
            transform: scale(1.2) translateY(-5px);
            box-shadow: 0 0 0 3px #ffd700, 0 10px 20px rgba(0,0,0,0.4), 0 0 15px 5px rgba(255, 215, 0, 0.6);
            z-index: 100; background-color: #fffcee; border-color: #b8860b;
        }
        .cell.selected::before, .cell.selected::after { background-color: #ffd700; z-index: 2; height: 3px; width: 3px; }
        .cell.selected { background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 20%, transparent 70%); }

        /* === [추가] 이동 가능 위치 표시 (초록색 점) === */
        .cell.movable { cursor: pointer; }
        .cell.movable::after {
            content: ''; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 18px; height: 18px;
            background-color: var(--movable-color);
            border-radius: 50%;
            z-index: 5; /* 선보다 위, 기물보다 아래 */
            box-shadow: 0 0 5px var(--movable-color);
        }
        /* 적군을 잡을 수 있는 경우 (빨간 테두리 점) */
        .cell.movable:has(.piece)::after {
            background-color: transparent;
            border: 3px solid rgba(231, 76, 60, 0.9); /* 빨간색 */
            width: 45px; height: 45px;
            z-index: 20; /* 기물 위로 표시 */
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
        }

        /* 장군 효과 */
        .piece.king-in-check {
            box-shadow: 0 0 15px 5px rgba(255, 0, 0, 0.8);
            animation: pulse 1s infinite alternate;
            border-color: #ff0000 !important;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* 모달 */
        .game-over-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; z-index: 100; animation: fadeIn 0.5s; }
        .modal-content { background-color: white; padding: 30px 50px; border-radius: 10px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 5px solid #e6b87d; min-width: 300px; }
        .winner-text { font-size: 2em; font-weight: bold; margin: 20px 0; color: #333; }
        .modal-buttons { margin-top: 30px; display: flex; gap: 15px; justify-content: center; }
        .btn-modal { padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; color: white; cursor: pointer; border: none; }
        .btn-lobby { background-color: #555; }
        .btn-new { background-color: #2e7d32; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<h1>♟️ Spring Boot 장기</h1>

<div class="game-info">
    <div style="margin-bottom: 15px; padding: 10px; background-color: #f9f9f9; border-radius: 5px; border: 1px solid #ddd;">
        <span style="font-size: 1.1em; color: #333;">당신은 </span>
        <span th:if="${loginMember.id == game.choPlayer.id}" style="color: white; background-color: #2e7d32; padding: 5px 10px; border-radius: 4px; font-weight: bold;">초(楚) - 초록</span>
        <span th:if="${game.hanPlayer != null && loginMember.id == game.hanPlayer.id}" style="color: white; background-color: #c62828; padding: 5px 10px; border-radius: 4px; font-weight: bold;">한(漢) - 빨강</span>
        <span th:if="${loginMember.id != game.choPlayer.id && (game.hanPlayer == null || loginMember.id != game.hanPlayer.id)}" style="color: white; background-color: #555; padding: 5px 10px; border-radius: 4px; font-weight: bold;">관전자 (Observer)</span>
        <span style="font-size: 1.1em; color: #333;"> 입니다.</span>
    </div>

    <div>
        현재 턴:
        <span class="turn-badge"
              th:classappend="${game.currentTurn.name() == 'CHO'} ? 'turn-CHO' : 'turn-HAN'"
              th:text="${game.currentTurn.name() == 'CHO'} ? '초(楚) - 초록' : '한(漢) - 빨강'">
            </span>
    </div>

    <div style="margin-top: 10px; font-size: 0.9em; font-weight: bold;">
        <span style="color: var(--cho-color)">초: <span th:text="${choScore}">0.0</span>점</span>
        <span style="margin: 0 10px; color: #ccc;">|</span>
        <span style="color: var(--han-color)">한: <span th:text="${hanScore}">0.0</span>점 (덤 1.5)</span>
    </div>

    <div style="margin-top: 5px; color: #666;">
        진행 수: <span th:text="${game.moveCount}">0</span>수
    </div>
</div>

<div class="board-container" id="boardContainer">
    <div class="janggi-board">
        <div class="palace-overlay palace-top"></div>
        <div class="palace-overlay palace-bottom"></div>

        <th:block th:each="y : ${#numbers.sequence(0, 9)}">
            <th:block th:each="x : ${#numbers.sequence(0, 8)}">
                <div class="cell"
                     th:with="piece=${board.getPiece(x, y)}"
                     th:classappend="${y == 0 ? 'top-edge' : ''} + ' ' +
                                         ${y == 9 ? 'bottom-edge' : ''} + ' ' +
                                         ${x == 0 ? 'left-edge' : ''} + ' ' +
                                         ${x == 8 ? 'right-edge' : ''}"
                     th:onclick="handleClick([[${x}]], [[${y}]])"
                     th:id="'cell-' + ${x} + '-' + ${y}">

                    <div th:if="${piece != null}"
                         class="piece"
                         th:classappend="${piece.team} + ' ' + ${piece.type}">
                            <span th:switch="${piece.type.name()}">
                                <span th:case="'GUNG'" th:text="${piece.team.name() == 'CHO' ? '楚' : '漢'}"></span>
                                <span th:case="'SOLDIER'" th:text="${piece.team.name() == 'CHO' ? '卒' : '兵'}"></span>
                                <span th:case="'CHA'">車</span>
                                <span th:case="'PO'">包</span>
                                <span th:case="'MA'">馬</span>
                                <span th:case="'SANG'">象</span>
                                <span th:case="'SA'">士</span>
                            </span>
                    </div>

                </div>
            </th:block>
        </th:block>
    </div>
</div>

<div th:if="${game.status.name() == 'FINISHED'}" class="game-over-overlay">
    <div class="modal-content">
        <h1>🏆 게임 종료! 🏆</h1>
        <div class="winner-text">
            <span th:text="${game.winner.description}"></span>
        </div>
        <p th:text="'총 ' + ${game.moveCount} + '수 만에 승부가 났습니다.'"></p>
        <div class="modal-buttons">
            <a href="/" class="btn-modal btn-lobby">로비로 나가기</a>
            <a href="/games/new" class="btn-modal btn-new">다시 한 판 하기</a>
        </div>
    </div>
</div>

<div style="margin-top: 20px;">
    <a href="/" style="text-decoration: none; color: #555; border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; background: white;">🏠 로비로 이동</a>
</div>

<script th:inline="javascript">
    const gameId = [[${game.id}]];
    const gameStatus = [[${game.status}]];
    const currentTurn = [[${game.currentTurn}]];
    let currentMoveCount = [[${game.moveCount}]];
    const isCheck = [[${isCheck}]];

    const myId = [[${loginMember.id}]];
    const choPlayerId = [[${game.choPlayer.id}]];
    const hanPlayerId = [[${game.hanPlayer != null ? game.hanPlayer.id : -1}]];

    let myTeam = "OBSERVER";
    if (myId === choPlayerId) myTeam = "CHO";
    else if (myId === hanPlayerId) myTeam = "HAN";

    if (gameStatus === 'IN_PROGRESS' && myTeam !== 'OBSERVER' && myTeam !== currentTurn) {
        document.getElementById('boardContainer').classList.add('inactive');
    }

    if (gameStatus === 'IN_PROGRESS' && isCheck) {
        if (myTeam === currentTurn) {
            setTimeout(() => alert("⚠️ 장군! 왕을 보호하세요!"), 100);
        }
        setTimeout(() => {
            const kingPiece = document.querySelector(`.piece.GUNG.${currentTurn}`);
            if (kingPiece) kingPiece.classList.add('king-in-check');
        }, 100);
    }

    if (gameStatus !== 'FINISHED') {
        setInterval(() => {
            fetch(`/api/games/${gameId}/status`)
                .then(res => res.json())
                .then(data => {
                    if (data.moveCount > currentMoveCount || data.status !== gameStatus) {
                        location.reload();
                    }
                })
                .catch(err => console.error(err));
        }, 1500);
    }

    let selectedFrom = null;

    // === [추가] 마커 초기화 함수 ===
    function clearMovables() {
        document.querySelectorAll('.cell.movable').forEach(el => el.classList.remove('movable'));
    }

    // === [추가] 이동 가능 위치 API 호출 및 표시 ===
    function showMovablePositions(from) {
        fetch(`/api/games/${gameId}/movable?from=${from}`)
            .then(res => res.json())
            .then(positions => {
                positions.forEach(posStr => {
                    const colChar = posStr.charAt(0);
                    const rowStr = posStr.substring(1);
                    const x = colChar.charCodeAt(0) - 65;
                    const y = parseInt(rowStr) - 1;

                    const cellId = `cell-${x}-${y}`;
                    const cell = document.getElementById(cellId);
                    if (cell) {
                        cell.classList.add('movable');
                    }
                });
            })
            .catch(err => console.error("이동 경로 조회 실패", err));
    }

    function toCoordinate(x, y) {
        const col = String.fromCharCode(65 + x);
        const row = y + 1;
        return col + row;
    }

    function handleClick(x, y) {
        if (gameStatus === 'FINISHED') return;
        if (myTeam === 'OBSERVER') { alert("관전자 모드입니다."); return; }
        if (myTeam !== currentTurn) { console.log("Not your turn"); return; }

        const clickedCoord = toCoordinate(x, y);
        const cellId = 'cell-' + x + '-' + y;
        const cellElement = document.getElementById(cellId);

        if (selectedFrom === null) {
            if (cellElement.children.length === 0) return;
            const pieceDiv = cellElement.querySelector('.piece');
            if (pieceDiv && !pieceDiv.classList.contains(myTeam)) {
                alert("당신의 기물이 아닙니다.");
                return;
            }
            selectedFrom = clickedCoord;
            cellElement.classList.add('selected');

            // [추가] 이동 가능 위치 표시
            showMovablePositions(clickedCoord);

        } else {
            if (selectedFrom === clickedCoord) {
                document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
                clearMovables(); // [추가] 취소 시 마커 제거
                selectedFrom = null;
                return;
            }
            movePiece(selectedFrom, clickedCoord);
            clearMovables(); // [추가] 이동 요청 후 마커 제거
        }
    }

    function movePiece(from, to) {
        fetch(`/api/games/${gameId}/move`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: from, to: to })
        })
            .then(async response => {
                if (response.ok) {
                    location.reload();
                } else {
                    const text = await response.text();
                    try {
                        const errData = JSON.parse(text);
                        alert("🚫 " + errData.message);
                    } catch (e) {
                        alert("❌ 서버 오류가 발생했습니다.");
                    }
                    document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
                    selectedFrom = null;
                }
            })
            .catch(err => {
                alert("서버와 연결할 수 없습니다.");
            });
    }
</script>
</body>
</html>
